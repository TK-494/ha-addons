# Alternative deployment for any non-HAOS Docker host.
# Builds the same single-container image used by the HA add-on.
#
# Usage:
#   docker compose up -d --build
#   open http://<host>:8766
#
services:
  homelab-inventory:
    build:
      context: .
      args:
        BUILD_FROM: python:3.11-alpine
    container_name: homelab-inventory
    restart: unless-stopped
    ports:
      - "8766:8000"
    volumes:
      - homelab-data:/data
    environment:
      - INVENTORY_PATH=/data/infrastructure.yaml
      # Standalone compose runs publish the port, so bind to all interfaces.
      # Inside HAOS the add-on uses run.sh's default (127.0.0.1) for safety.
      - BIND_HOST=0.0.0.0

volumes:
  homelab-data:
