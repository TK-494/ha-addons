name: Homelab Inventory
version: "1.2.4"
slug: homelab-inventory
description: Living inventory of homelab hardware, network, applications and integrations. Tracks uptime via Home Assistant entities and auto-discovers devices/hosts (HA registry + LAN ARP sweep). YAML-backed, browse and edit through the UI.
url: https://github.com/TK-494/ha-addons/tree/main/homelab-inventory
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:server-network
panel_title: Homelab
homeassistant_api: true
hassio_api: false
host_network: true
# NET_RAW is the only capability arp-scan needs to open AF_PACKET sockets.
# NET_ADMIN (route/iptables changes) is deliberately NOT requested.
privileged:
  - NET_RAW
map:
  - addon_config:rw
options: {}
schema: {}
