name: Financials
version: "0.6.0"
slug: financials
description: Huishoudboekje — importeer CSV-exports van Rabobank, Rabobank creditcard en ASN Bank en houd inkomsten, uitgaven en overboekingen tussen je eigen rekeningen uit elkaar.
url: https://github.com/TK-494/ha-addons/tree/main/financials
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8000
panel_icon: mdi:finance
panel_title: Financials
# Only /data is written: the SQLite database and the uploaded CSV files both
# live there, so Home Assistant backups cover everything in one go.
# Needed to publish the sensors; no user token required.
homeassistant_api: true
options: {}
schema: {}
