services:
  gezondheid:
    build:
      context: .
      dockerfile: Dockerfile
    image: apple-health-dashboard:latest
    container_name: apple-health-dashboard
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${APP_HOST:-127.0.0.1}:${APP_PORT:-8095}:8095"
    volumes:
      - "${HEALTH_DATA_DIR:-./data/parsed}:/data/parsed:rw"
